# Version de Rust utilisée par le projet, sur le poste de Cédric comme en CI.
#
# ⚠️ Sans ce fichier, chaque job de la CI prenait « stable », donc une version qui change toute seule : une nouvelle
# version de Rust ou de clippy pouvait rendre la CI rouge du jour au lendemain sans qu'on ait rien touché, en plein
# travail sur autre chose. La mise à jour devient un geste volontaire : changer le numéro ici, lancer
# `cargo run -p otb-dev -- verify`, corriger ce que le nouveau clippy signale, et le dire dans le CHANGELOG.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
