# Espace de travail Cargo de la migration vers Rust (D-031, docs/migration-rust.md).
[workspace]
resolver = "3"
members = ["otb-advisor", "otb-analysis", "otb-cli", "otb-decoder", "otb-dev", "otb-dsp", "otb-format", "otb-gui", "otb-log", "otb-parity"]

[workspace.package]
version = "0.9.0"
edition = "2024"
publish = false
# La licence du projet (D-045). Identifiant SPDX « LicenseRef- » : PolyForm Noncommercial n'est pas dans la liste
# SPDX officielle. Les crates ne sont pas publiées (`publish = false`), mais le manifeste ne disait rien du tout.
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"

# Aucun code `unsafe` dans le projet : le décodeur lit des fichiers venus d'ailleurs, et seul du code `unsafe` pourrait faire d'un
# fichier piégé une lecture ou une écriture hors des données du programme. « deny » et non « forbid » : l'exemple
# `otb-gui/examples/banc_cache.rs` (jamais livré) compte les allocations avec du code `unsafe` et lève l'interdiction pour lui seul.
# Chaque crate s'y rattache par `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "deny"

# Les tests de `otb-gui` lient chacun egui et wgpu : ≈ 490 Mo par binaire avec toutes les infos de débogage, 186 Mo avec les seules
# tables de lignes (mesuré le 2026-11-01). Sans cela, `cargo test` remplissait le disque du runner Ubuntu de la CI (L-069).
# Les messages de panique gardent leurs numéros de ligne.
[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
