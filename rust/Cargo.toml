# Espace de travail Cargo de la migration vers Rust (D-031, docs/migration-rust.md).
[workspace]
resolver = "3"
members = ["otb-analysis", "otb-decoder", "otb-dsp", "otb-log", "otb-py"]
exclude = ["otb-spike-egui"]

[workspace.package]
version = "0.8.0"
edition = "2024"
publish = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
