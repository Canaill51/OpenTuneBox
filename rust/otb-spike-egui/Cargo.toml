# Prototype d'interface egui (E1, D-035). Jetable : hors de l'espace de travail, donc hors de la CI.
[package]
name = "otb-spike-egui"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
eframe = "0.37"
egui = "0.37"
egui_plot = "0.38"
egui_commonmark = "0.26"
rfd = "0.17"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }

[profile.release]
opt-level = 3
