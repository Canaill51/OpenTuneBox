[package]
name = "otb-analysis"
description = "Boucles par fenêtre de analysis/motors.py (atténuation des notchs RPM, hauteur des harmoniques, spectres masqués) ; Rust pur, dépendances : otb-dsp et rayon"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
otb-dsp = { path = "../otb-dsp" }
otb-log = { path = "../otb-log" }
otb-format = { path = "../otb-format" }
rayon = "1.12.0"

[dev-dependencies]
serde_json = "1"
otb-decoder = { path = "../otb-decoder" }
