[package]
name = "otb-py"
description = "Pont PyO3 : module Python opentunebox._native"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
otb-decoder = { path = "../otb-decoder" }
otb-dsp = { path = "../otb-dsp" }
otb-log = { path = "../otb-log" }
pyo3 = { version = "0.30", features = ["abi3-py311"] }
numpy = "0.30"
