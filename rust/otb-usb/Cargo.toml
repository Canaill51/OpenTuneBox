[package]
name = "otb-usb"
description = "Récupération des logs par USB, partie protocole (lot 32a) : trames MSP, lecture de la mémoire, contrôles avant effacement, port simulé ; aucune écriture de réglage sur la carte (D-063)"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
otb-decoder = { path = "../otb-decoder" }
otb-log = { path = "../otb-log" }
# Port série : BSD-2-Clause OR Apache-2.0. Pas `serialport` (MPL-2.0, copyleft refusé par `deny.toml`) : D-063.
serial2 = "0.2.39"

# Pseudo-terminal (`SerialPort::pair`) pour essayer le vrai port série sans matériel (`tests/port_serie.rs`, Linux).
[dev-dependencies]
serial2 = { version = "0.2.39", features = ["unix"] }

[lints]
workspace = true
