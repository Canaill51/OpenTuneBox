[package]
name = "otb-dev"
description = "Outils de développement d'OpenTuneBox, jamais livrés (phase 7, D-035) : vérification de la documentation (remplace tests/test_docs.py)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "otb_dev"

[[bin]]
name = "otb-dev"
path = "src/main.rs"

[dependencies]
ico = "0.6"
otb-format = { path = "../otb-format" }
regex = "1"
# Le SVG de l'icône n'a ni texte ni image : sans les fonctionnalités par défaut, pas de polices ni de décodeurs d'images.
resvg = { version = "0.49", default-features = false }

[dev-dependencies]
otb-advisor = { path = "../otb-advisor" }
otb-cli = { path = "../otb-cli" }
otb-gui = { path = "../otb-gui" }
