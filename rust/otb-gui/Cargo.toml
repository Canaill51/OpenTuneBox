[package]
name = "otb-gui"
description = "Interface egui d'OpenTuneBox (phase 6, D-035) : socle commun (thème, état, calculs en arrière-plan, tracés), puis une page par outil"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "otb_gui"

[[bin]]
name = "opentunebox-gui"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
otb-advisor = { path = "../otb-advisor" }
otb-analysis = { path = "../otb-analysis" }
otb-format = { path = "../otb-format" }
otb-log = { path = "../otb-log" }
eframe = { version = "0.37", features = ["persistence"] }
egui = "0.37"
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark"] }
egui_plot = "0.38"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
otb-decoder = { path = "../otb-decoder" }
otb-parity = { path = "../otb-parity" }
