[package]
name = "otb-parity"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Comparateur de parité (D-035) : rejoue en Rust les appels de modules enregistrés avec l'étalon Python (golden.py record-modules)"

[dependencies]
otb-advisor = { path = "../otb-advisor" }
otb-analysis = { path = "../otb-analysis" }
otb-cli = { path = "../otb-cli" }
otb-decoder = { path = "../otb-decoder" }
otb-dsp = { path = "../otb-dsp" }
otb-log = { path = "../otb-log" }
serde_json = "1"
sha2 = "0.11.1"
zip = { version = "9", default-features = false, features = ["deflate"] }
