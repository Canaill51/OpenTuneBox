[package]
name = "otb-advisor"
description = "Assistant de réglage (advisor/ de Python) : profils de taille, règles, diagnostic du bruit, réglage de la réponse indicielle (phase 5a, D-035) ; Rust pur"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
otb-analysis = { path = "../otb-analysis" }
otb-dsp = { path = "../otb-dsp" }
otb-format = { path = "../otb-format" }
otb-log = { path = "../otb-log" }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
flate2 = "1"
otb-decoder = { path = "../otb-decoder" }
