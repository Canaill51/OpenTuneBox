[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "opentunebox"
version = "0.8.0"
description = "Analyse de logs Blackbox Betaflight pour le réglage des drones (PID, filtres, vibrations)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Cedric", email = "desmetgerry@gmail.com" }]
license = { file = "LICENSE" }
keywords = ["betaflight", "blackbox", "pid", "fft", "drone", "fpv"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.0",
    "PySide6>=6.7",
    "pyqtgraph>=0.13.7",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
# scipy et numba : références des tests seulement (D-031, phase 2a) ; l'application n'en a plus besoin
dev = ["scipy>=1.13", "numba>=0.60", "pytest>=8", "pytest-qt>=4.4", "pytest-cov>=5", "ruff>=0.15,<0.18", "pyinstaller>=6", "pyyaml>=6"]

[project.scripts]
opentunebox = "opentunebox.cli:main"

[project.gui-scripts]
opentunebox-gui = "opentunebox.gui.app:main"

# Extension Rust opentunebox._native (D-031) : `pip install -e .` la compile (cargo requis, voir CONTRIBUTING.md)
[tool.maturin]
python-source = "src"
module-name = "opentunebox._native"
manifest-path = "rust/otb-py/Cargo.toml"
features = ["pyo3/extension-module"]
profile = "release"

[tool.ruff.lint]
# Mêmes contrôles que pyflakes (D-030) : imports et variables inutiles, noms indéfinis. Les règles de style
# (E, W, formatage) sont reportées (W-017).
select = ["F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["corpus: tests qui utilisent les vrais logs de ~/Documents/Drones/Logs (lents)"]
