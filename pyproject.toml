[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opentunebox"
version = "0.2.0"
description = "Analyse de logs Blackbox Betaflight pour le réglage des drones (PID, filtres, vibrations)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Cedric", email = "desmetgerry@gmail.com" }]
license = { file = "LICENSE" }
keywords = ["betaflight", "blackbox", "pid", "fft", "drone", "fpv"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "numba>=0.60",
    "PySide6>=6.7",
    "pyqtgraph>=0.13.7",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pyflakes>=3", "pyinstaller>=6"]

[project.scripts]
opentunebox = "opentunebox.cli:main"

[project.gui-scripts]
opentunebox-gui = "opentunebox.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["corpus: tests qui utilisent les vrais logs de ~/Documents/Drones/Logs (lents)"]
