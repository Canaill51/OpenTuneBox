# Mises à jour automatiques des dépendances : Dependabot ouvre une demande de fusion par semaine et par
# famille (Python, actions GitHub). Les mises à jour mineures et correctives sont groupées en une seule
# demande ; une mise à jour majeure (changement possible de comportement) reste une demande à part.
# Chaque demande passe par la CI (« Tests » et « Audit ») avant d'être fusionnée à la main.
version: 2
updates:
  - package-ecosystem: "pip" # lit les dépendances de pyproject.toml
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions" # lit .github/workflows/*.yml
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
