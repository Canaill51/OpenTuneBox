# Mises à jour automatiques : une demande de fusion hebdomadaire (lundi) pour les actions GitHub et pour les crates Rust, dont les
# mises à jour mineures et correctives sont groupées ; une mise à jour majeure reste une demande à part.
# Les failles des bibliothèques sont contrôlées par le workflow audit.yml.
version: 2
updates:
  - package-ecosystem: "cargo" # lit rust/Cargo.toml et rust/Cargo.lock (migration Rust, phase 7)
    directory: "/rust"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      cargo:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions" # lit .github/workflows/*.yml ; les actions y sont épinglées par SHA, Dependabot garde le commentaire de version à jour
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
