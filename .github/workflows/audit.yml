# Contrôle des vulnérabilités connues dans les bibliothèques dont dépend OpenTuneBox (cargo-deny : failles RustSec,
# licences, origine des crates, réglages dans rust/deny.toml). Se lance à chaque envoi et demande de fusion, et chaque lundi : une faille peut être
# publiée sans qu'on ait changé une ligne. Échec = une dépendance a une faille connue : la mettre à jour
# (Dependabot propose souvent déjà la demande de fusion).
name: Audit
on:
  push:
    branches: [main, feat/rust-migration]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Dépendances Rust : mêmes réglages qu'en local (`cd rust && cargo deny check`). Un avis « non maintenu » sans correctif se met dans
  # `ignore` de rust/deny.toml avec sa raison, jamais en retirant le contrôle.
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: rust/Cargo.toml
          # Par défaut l'action ajoute `--all-features` : on veut le même arbre que le build livré.
          arguments: ""
