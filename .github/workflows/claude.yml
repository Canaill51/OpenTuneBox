# Claude Code à la demande dans les issues et les demandes de fusion : il ne se déclenche QUE si quelqu'un écrit
# « @claude » dans un commentaire, ou en ouvrant une issue (titre ou corps). Aucune relecture automatique de chaque
# demande de fusion (volontaire : chaque passage consomme l'abonnement Claude et des minutes GitHub Actions). Pour une
# relecture, lancer `/code-review` depuis Claude Code en local, ou écrire le commentaire ici.
# Jeton : secret CLAUDE_CODE_OAUTH_TOKEN du dépôt, créé avec `claude setup-token` (abonnement Pro/Max).
name: Claude
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

permissions:
  contents: write        # pousser un correctif sur la branche de la demande de fusion
  pull-requests: write   # répondre et commenter
  issues: write          # répondre dans une issue
  actions: read          # lire les résultats de la CI (tests.yml) pour en parler
  id-token: write        # jeton OIDC de l'action

# Un seul passage de Claude à la fois par issue ou demande de fusion : deux commentaires d'affilée ne lancent pas
# deux machines qui se marchent dessus.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # ⚠️ Dépôt public : sans ce filtre, n'importe qui pourrait lancer Claude en commentaire et consommer
    # l'abonnement. Seul le propriétaire du dépôt déclenche. Pour ouvrir à un collaborateur, ajouter son
    # identifiant ici (l'action refuse déjà par défaut qui n'a pas le droit d'écriture, ceci est la deuxième barrière).
    if: >-
      github.event.sender.login == github.repository_owner &&
      (
        (
          (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
          contains(github.event.comment.body, '@claude')
        ) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (
          github.event_name == 'issues' &&
          (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # ⚠️ Demande de fusion venue d'un fork : Claude y lancerait `cargo`, donc les build.rs et les tests écrits par un inconnu,
      # avec le jeton de l'abonnement dans l'environnement ; un `.claude/settings.json` modifié y ajouterait ses propres
      # crochets. On s'arrête donc AVANT de récupérer son code (le filtre sur l'auteur du commentaire ne suffit pas : c'est
      # Cédric qui écrit « @claude », mais sur le code d'un autre). Pour la faire relire : lire ses changements, les reprendre
      # sur une branche du dépôt, puis écrire « @claude » sur cette nouvelle demande de fusion.
      - name: "Refus des demandes de fusion venues d'un fork"
        if: github.event.issue.pull_request || github.event.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMERO: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          # Réponse illisible (réseau, droits) = refus aussi : le doute ne laisse pas passer.
          fork=$(gh pr view "$NUMERO" --json isCrossRepository -q .isCrossRepository)
          if [ "$fork" != false ]; then
            echo "::error::demande de fusion venue d'un fork (réponse : « $fork ») : Claude ne travaille pas sur le code d'un tiers."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # La machine de la CI n'a ni le corpus de vrais logs ni les références figées : Claude ne peut lancer
          # que les tests qui s'en passent (`cargo run -p otb-dev -- verify --quick`). Les consignes du dépôt
          # (CLAUDE.md, AGENTS.md, .claude/skills/) sont lues automatiquement, comme en local.
          claude_args: --allowed-tools "Bash(cargo:*),Bash(git:*),Bash(rustup:*)"

      # Quand Claude échoue, l'action remplace sa sortie par « full output hidden for security » : on ne sait pas
      # pourquoi. Cette étape rend UNIQUEMENT le message d'erreur final, jamais la conversation — important, le dépôt
      # est public et ses journaux d'Actions sont lisibles par tout le monde.
      - name: "Message d'erreur de Claude"
        if: failure()
        run: |
          fichier="$RUNNER_TEMP/claude-execution-output.json"
          if [ ! -f "$fichier" ]; then
            echo "Pas de fichier de sortie : Claude n'a même pas démarré (voir l'étape en échec plus haut)."
            exit 0
          fi
          jq -r '.[] | select(.type == "result") | (.subtype // "?") + " : " + ((.result // .error // "message absent") | tostring)' \
            "$fichier" | head -c 1000
          echo
