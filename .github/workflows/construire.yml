# Construction automatique d'OpenTuneBox pour Windows, macOS et Linux sur les serveurs de GitHub.
# Se lance à la main (onglet « Actions » → « Construire OpenTuneBox » → « Run workflow ») ou en poussant
# une étiquette de version (git tag v0.2.0 && git push origin v0.2.0).
# Avec une étiquette de version, les fichiers sont publiés sur une page « Releases » permanente
# (préparer d'abord la version : python scripts/release.py prepare 0.2.0, voir CONTRIBUTING.md) :
# brouillon de la page, chaque système y envoie son fichier, puis publication quand les trois sont là.
# Les fichiers ne passent pas par les « Artifacts » de GitHub : leur stockage, limité à 500 Mo pour un
# dépôt privé, se remplissait (≈ 290 Mo par construction, gardés 90 jours). Lancement à la main : fichiers
# téléchargeables en bas de la page de l'exécution (« Artifacts »), gardés un jour seulement.
# Fichiers produits :
#   OpenTuneBox-Windows-Setup.exe  installateur Windows (menu Démarrer, Bureau, .bbl, désinstallation)
#   OpenTuneBox-macOS.dmg          glisser OpenTuneBox dans Applications (Mac Apple Silicon)
#   OpenTuneBox-Linux.AppImage     un seul fichier : le rendre exécutable, puis double-clic
name: Construire OpenTuneBox
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  # Brouillon de la page « Releases » (invisible tant qu'il n'est pas publié) : seulement pour une étiquette v….
  # Déjà créé (relance après un échec) : on le garde.
  brouillon:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Notes de version (section du CHANGELOG)
        # Arrête tout de suite si le numéro du projet ou le CHANGELOG ne correspond pas à l'étiquette.
        run: python3 scripts/release.py notes "$GITHUB_REF_NAME" > notes.md
      - name: Brouillon de la page de la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "OpenTuneBox ${GITHUB_REF_NAME#v}" --notes-file notes.md

  construire:
    needs: brouillon
    # Lancement à la main : « brouillon » est sauté, la construction a quand même lieu.
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package: OpenTuneBox-Windows-Setup.exe
          - os: macos-latest
            package: OpenTuneBox-macOS.dmg
          # Ubuntu le plus ancien disponible : l'exécutable fonctionne sur les Linux de même âge ou plus récents
          # (il dépend de la version de la bibliothèque C du système qui l'a fabriqué).
          - os: ubuntu-22.04
            package: OpenTuneBox-Linux.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Cohérence de l'étiquette de version
        if: startsWith(github.ref, 'refs/tags/v')
        # Arrête tout de suite si le numéro du projet ou le CHANGELOG ne correspond pas à l'étiquette.
        shell: bash
        run: python scripts/release.py notes "$GITHUB_REF_NAME" > /dev/null
      - name: Bibliothèques système Qt (Linux)
        if: runner.os == 'Linux'
        # Installées ici pour que PyInstaller les embarque : certaines (libxcb-cursor…) manquent sur
        # beaucoup de Linux, et Qt refuse alors d'ouvrir ses fenêtres.
        run: >
          sudo apt-get update && sudo apt-get install -y
          libegl1 libgl1 libfontconfig1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0
          libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0
          libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xkb1
      - name: Rust
        # L'extension opentunebox._native (D-031) se compile à l'installation du paquet.
        run: rustup toolchain install stable --profile minimal
      - name: Dépendances
        # scipy et numba : références des tests seulement (D-032) ; retirés avant la construction
        run: python -m pip install . pyinstaller pytest scipy numba
      - name: Tests rapides
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -m "not corpus" tests/test_decoder.py tests/test_native_decoder.py tests/test_analysis.py tests/test_bf_filters.py tests/test_sliders.py
      - name: Retirer scipy et numba avant la construction
        # L'exécutable ne doit pas les contenir (≈ 350 Mo, D-032) : on les enlève pour qu'aucune recette ne puisse les reprendre.
        run: python -m pip uninstall -y scipy numba llvmlite
      - name: Exécutable
        # Les serveurs n'ont pas d'écran : si une bibliothèque crée une fenêtre pendant l'analyse, elle reste invisible.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m PyInstaller packaging/opentunebox.spec --noconfirm
      # Essais de démarrage : l'interface doit rester ouverte 20 s sans planter.
      - name: Démarrage de l'exécutable (Windows)
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath dist\OpenTuneBox\OpenTuneBox.exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { Write-Error "OpenTuneBox s'est arrêté (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force
      - name: Démarrage de l'exécutable (macOS)
        if: runner.os == 'macOS'
        # perl coupe le programme au bout de 20 s (signal d'alarme, code 142) : il était donc toujours ouvert.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          perl -e 'alarm 20; exec @ARGV' dist/OpenTuneBox.app/Contents/MacOS/OpenTuneBox
          code=$?
          echo "code de sortie : $code"
          test $code -eq 142

      - name: Installateur (Windows)
        if: runner.os == 'Windows'
        run: |
          $version = python -c "import opentunebox; print(opentunebox.__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=$version" packaging\windows\opentunebox.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Move-Item dist\OpenTuneBox-Windows-Setup.exe ${{ matrix.package }}
      - name: Essai de l'installateur (Windows)
        if: runner.os == 'Windows'
        # Installe sans questions pour l'utilisateur courant, lance le programme installé, puis désinstalle.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          Start-Process -Wait -FilePath .\${{ matrix.package }} -ArgumentList '/VERYSILENT', '/CURRENTUSER', '/TASKS=associate'
          $dir = "$env:LOCALAPPDATA\Programs\OpenTuneBox"
          if (-not (Test-Path "$dir\OpenTuneBox.exe")) { Write-Error "programme absent de $dir"; exit 1 }
          if (-not (Test-Path "Registry::HKEY_CURRENT_USER\Software\Classes\OpenTuneBox.BlackboxLog\shell\open\command")) { Write-Error "association .bbl absente"; exit 1 }
          $p = Start-Process -FilePath "$dir\OpenTuneBox.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { Write-Error "OpenTuneBox installé s'est arrêté (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Start-Sleep -Seconds 2
          Start-Process -Wait -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT'
          Start-Sleep -Seconds 5
          if (Test-Path "$dir\OpenTuneBox.exe") { Write-Error "la désinstallation a laissé le programme"; exit 1 }
          if (Test-Path "Registry::HKEY_CURRENT_USER\Software\Classes\OpenTuneBox.BlackboxLog") { Write-Error "la désinstallation a laissé l'association .bbl"; exit 1 }
          Write-Host "installation, lancement et désinstallation : ok"
      - name: Image disque (macOS)
        if: runner.os == 'macOS'
        # Seulement OpenTuneBox.app : le dossier dist/OpenTuneBox en est une copie.
        run: |
          sh packaging/macos/build_dmg.sh dist/OpenTuneBox.app ${{ matrix.package }}
          hdiutil verify ${{ matrix.package }}
          plutil -p dist/OpenTuneBox.app/Contents/Info.plist | grep -E "CFBundleShortVersionString|blackbox-log"
      - name: AppImage (Linux)
        if: runner.os == 'Linux'
        # appimagetool en version fixe, vérifiée par son empreinte SHA-256.
        run: |
          curl -sSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          APPIMAGETOOL="$PWD/appimagetool" sh packaging/linux/build_appimage.sh dist/OpenTuneBox ${{ matrix.package }}
      - name: Démarrage de l'AppImage (Linux)
        if: runner.os == 'Linux'
        # « timeout » arrête le programme au bout de 20 s avec le code 124 : il était donc toujours ouvert.
        # APPIMAGE_EXTRACT_AND_RUN : les serveurs de GitHub n'autorisent pas FUSE.
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          set +e
          timeout 20 ./${{ matrix.package }}
          code=$?
          echo "code de sortie : $code"
          test $code -eq 124

      # Version : fichier envoyé dans le brouillon de la page « Releases » (remplacé s'il y est déjà).
      - name: Envoi sur la page de la version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" ${{ matrix.package }} --clobber
      # Lancement à la main : fichier envoyé tel quel (droits d'exécution conservés), gardé un jour.
      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          path: ${{ matrix.package }}
          archive: false
          if-no-files-found: error
          retention-days: 1

  # Publication de la page « Releases », une fois les trois systèmes construits et envoyés.
  publier:
    needs: construire
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publication de la page de la version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' | LC_ALL=C sort | tee fichiers.txt
          # Exactement les trois fichiers attendus (Windows, macOS, Linux), sinon on s'arrête.
          printf '%s\n' OpenTuneBox-Linux.AppImage OpenTuneBox-Windows-Setup.exe OpenTuneBox-macOS.dmg | diff - fichiers.txt
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
