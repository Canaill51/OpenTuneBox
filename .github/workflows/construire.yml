# Construction automatique d'OpenTuneBox pour Windows, macOS et Linux sur les serveurs de GitHub.
# Se lance à la main : onglet « Actions » du dépôt → « Construire OpenTuneBox » → « Run workflow ».
# Les archives sont ensuite téléchargeables en bas de la page de l'exécution (« Artifacts »).
name: Construire OpenTuneBox
on: workflow_dispatch

jobs:
  construire:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dépendances
        run: python -m pip install . pyinstaller pytest
      - name: Tests rapides
        run: python -m pytest -q -m "not corpus" tests/test_decoder.py tests/test_analysis.py tests/test_bf_filters.py tests/test_sliders.py tests/test_advisor.py
      - name: Exécutable
        run: python -m PyInstaller packaging/opentunebox.spec --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: OpenTuneBox-${{ runner.os }}
          path: dist/
