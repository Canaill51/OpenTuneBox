# Construction automatique d'OpenTuneBox pour Windows et Linux sur les serveurs de GitHub (macOS abandonné : D-042).
# Se lance à la main (onglet « Actions » → « Construire OpenTuneBox » → « Run workflow ») ou en poussant
# une étiquette de version (git tag v0.2.0 && git push origin v0.2.0).
# Avec une étiquette de version, les fichiers sont publiés sur une page « Releases » permanente
# (préparer d'abord la version : cd rust && cargo run -p otb-dev -- release prepare 0.2.0, voir CONTRIBUTING.md) :
# brouillon de la page, chaque système y envoie son fichier, puis publication quand les deux sont là.
# Les fichiers ne passent pas par les « Artifacts » de GitHub : leur stockage, limité à 500 Mo pour un
# dépôt privé, se remplissait. Lancement à la main : fichiers téléchargeables en bas de la page de
# l'exécution (« Artifacts »), gardés un jour seulement.
# Le programme est l'interface Rust (`cargo build --release -p otb-gui`) : un seul fichier, sans Python.
# Fichiers produits :
#   OpenTuneBox-Windows-Setup.exe  installateur Windows (menu Démarrer, Bureau, .bbl, désinstallation)
#   OpenTuneBox-Linux.AppImage     un seul fichier : le rendre exécutable, puis double-clic
name: Construire OpenTuneBox
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  # Brouillon de la page « Releases » (invisible tant qu'il n'est pas publié) : seulement pour une étiquette v….
  # Déjà créé (relance après un échec) : on le garde.
  brouillon:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Le jeton (droit d'écriture sur la page Releases) ne doit pas rester dans .git/config pendant la compilation : les build.rs et
          # macros de centaines de crates tierces y tournent. `gh` reçoit le jeton par GH_TOKEN, il n'en a pas besoin.
          persist-credentials: false
      - name: Rust
        run: rustup toolchain install stable --profile minimal
      - name: Notes de version (section du CHANGELOG)
        # Arrête tout de suite si le numéro du projet ou le CHANGELOG ne correspond pas à l'étiquette : les jobs de
        # construction ne partent pas (« needs: brouillon »), ce contrôle n'a donc pas à y être refait.
        working-directory: rust
        run: cargo run --quiet -p otb-dev -- release notes "$GITHUB_REF_NAME" > ../notes.md
      - name: Brouillon de la page de la version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "OpenTuneBox ${GITHUB_REF_NAME#v}" --notes-file notes.md

  construire:
    needs: brouillon
    # Lancement à la main : « brouillon » est sauté, la construction a quand même lieu.
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package: OpenTuneBox-Windows-Setup.exe
          # Ubuntu le plus ancien disponible : l'exécutable fonctionne sur les Linux de même âge ou plus récents
          # (il dépend de la version de la bibliothèque C du système qui l'a fabriqué).
          - os: ubuntu-22.04
            package: OpenTuneBox-Linux.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Le jeton (droit d'écriture sur la page Releases) ne doit pas rester dans .git/config pendant la compilation : les build.rs et
          # macros de centaines de crates tierces y tournent. `gh` reçoit le jeton par GH_TOKEN, il n'en a pas besoin.
          persist-credentials: false
      - name: Rust
        run: rustup toolchain install stable --profile minimal
      - name: Bibliothèques pour l'essai de démarrage (Linux)
        if: runner.os == 'Linux'
        # Les serveurs n'ont ni écran ni carte graphique : écran virtuel (xvfb) et pilote Vulkan logiciel (lavapipe, dans
        # mesa-vulkan-drivers). Ces bibliothèques ne servent qu'à l'essai : le programme les cherche sur le système de l'utilisateur.
        run: >
          sudo apt-get update && sudo apt-get install -y
          xvfb mesa-vulkan-drivers libvulkan1 libegl1 libgl1 libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2
      - name: Exécutable
        shell: bash
        working-directory: rust
        env:
          # Windows : la bibliothèque C est embarquée, le programme ne demande aucune DLL de Visual C++ au PC de l'utilisateur.
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release -p otb-gui

      - name: Bibliothèques demandées par l'exécutable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # dumpbin vient de Visual Studio (vswhere le trouve) ; aucune DLL de Visual C++ ne doit être demandée (crt-static).
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find "VC\Tools\**\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) { Write-Error "dumpbin introuvable"; exit 1 }
          $dll = & $dumpbin /dependents rust\target\release\opentunebox-gui.exe | Out-String
          Write-Host $dll
          if ($dll -match '(?i)vcruntime|msvcp|concrt') { Write-Error "l'exécutable demande une DLL de Visual C++"; exit 1 }
      - name: Démarrage de l'exécutable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # L'interface doit rester ouverte 20 s sans planter, avec un petit log en argument (celui du double-clic).
        run: |
          $p = Start-Process -FilePath rust\target\release\opentunebox-gui.exe -ArgumentList tests\data\jeno5_5s.bbl -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { Write-Error "OpenTuneBox s'est arrêté (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force
      - name: Installateur (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $meta = cargo metadata --no-deps --format-version 1 --manifest-path rust\Cargo.toml | ConvertFrom-Json
          $version = ($meta.packages | Where-Object { $_.name -eq "otb-gui" }).version
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=$version" packaging\windows\opentunebox.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Move-Item dist\OpenTuneBox-Windows-Setup.exe ${{ matrix.package }}
          (Get-Item ${{ matrix.package }}).Length / 1MB | ForEach-Object { Write-Host ("taille de l'installateur : {0:N1} Mo" -f $_) }
      - name: Essai de l'installateur (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # Installe sans questions pour l'utilisateur courant, lance le programme installé, puis désinstalle.
        run: |
          Start-Process -Wait -FilePath .\${{ matrix.package }} -ArgumentList '/VERYSILENT', '/CURRENTUSER', '/TASKS=associate'
          $dir = "$env:LOCALAPPDATA\Programs\OpenTuneBox"
          if (-not (Test-Path "$dir\OpenTuneBox.exe")) { Write-Error "programme absent de $dir"; exit 1 }
          if (-not (Test-Path "Registry::HKEY_CURRENT_USER\Software\Classes\OpenTuneBox.BlackboxLog\shell\open\command")) { Write-Error "association .bbl absente"; exit 1 }
          $p = Start-Process -FilePath "$dir\OpenTuneBox.exe" -ArgumentList tests\data\jeno5_5s.bbl -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { Write-Error "OpenTuneBox installé s'est arrêté (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Start-Sleep -Seconds 2
          Start-Process -Wait -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT'
          Start-Sleep -Seconds 5
          if (Test-Path "$dir\OpenTuneBox.exe") { Write-Error "la désinstallation a laissé le programme"; exit 1 }
          if (Test-Path "Registry::HKEY_CURRENT_USER\Software\Classes\OpenTuneBox.BlackboxLog") { Write-Error "la désinstallation a laissé l'association .bbl"; exit 1 }
          Write-Host "installation, lancement et désinstallation : ok"

      - name: AppImage (Linux)
        if: runner.os == 'Linux'
        # appimagetool en version fixe, vérifiée par son empreinte SHA-256.
        run: |
          curl -sSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          APPIMAGETOOL="$PWD/appimagetool" sh packaging/linux/build_appimage.sh rust/target/release/opentunebox-gui ${{ matrix.package }}
          echo "taille de l'AppImage : $(( $(stat -c %s ${{ matrix.package }}) / 1048576 )) Mo"
      - name: Démarrage de l'AppImage (Linux)
        if: runner.os == 'Linux'
        # « timeout » arrête le programme au bout de 20 s avec le code 124 : il était donc toujours ouvert. Un petit log est
        # donné en argument (celui du double-clic). xvfb-run : écran virtuel.
        # APPIMAGE_EXTRACT_AND_RUN : les serveurs de GitHub n'autorisent pas FUSE.
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          set +e
          xvfb-run -a timeout 20 ./${{ matrix.package }} tests/data/jeno5_5s.bbl
          code=$?
          echo "code de sortie : $code"
          test $code -eq 124

      # Version : fichier envoyé dans le brouillon de la page « Releases » (remplacé s'il y est déjà).
      - name: Envoi sur la page de la version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" ${{ matrix.package }} --clobber
      # Lancement à la main : fichier envoyé tel quel (droits d'exécution conservés), gardé un jour.
      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          path: ${{ matrix.package }}
          archive: false
          if-no-files-found: error
          retention-days: 1

  # Publication de la page « Releases », une fois les deux systèmes construits et envoyés.
  publier:
    needs: construire
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publication de la page de la version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' | LC_ALL=C sort | tee fichiers.txt
          # Exactement les deux fichiers attendus (Windows, Linux), sinon on s'arrête.
          printf '%s\n' OpenTuneBox-Linux.AppImage OpenTuneBox-Windows-Setup.exe | diff - fichiers.txt
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
