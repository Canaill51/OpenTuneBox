# Construction automatique d'OpenTuneBox pour Windows, macOS et Linux sur les serveurs de GitHub.
# Se lance à la main (onglet « Actions » → « Construire OpenTuneBox » → « Run workflow ») ou en poussant
# une étiquette de version (git tag v0.2.0 && git push --tags).
# Chaque système produit une seule archive, téléchargeable en bas de la page de l'exécution (« Artifacts ») :
#   OpenTuneBox-Windows.zip   → décompresser, puis OpenTuneBox\OpenTuneBox.exe
#   OpenTuneBox-macOS.zip     → décompresser, puis OpenTuneBox.app (Mac Apple Silicon)
#   OpenTuneBox-Linux.tar.gz  → tar xzf, puis OpenTuneBox/OpenTuneBox
name: Construire OpenTuneBox
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  construire:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive: OpenTuneBox-Windows.zip
          - os: macos-latest
            archive: OpenTuneBox-macOS.zip
          # Ubuntu le plus ancien disponible : l'exécutable fonctionne sur les Linux de même âge ou plus récents
          # (il dépend de la version de la bibliothèque C du système qui l'a fabriqué).
          - os: ubuntu-22.04
            archive: OpenTuneBox-Linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Bibliothèques système Qt (Linux)
        if: runner.os == 'Linux'
        # Installées ici pour que PyInstaller les embarque : certaines (libxcb-cursor…) manquent sur
        # beaucoup de Linux, et Qt refuse alors d'ouvrir ses fenêtres.
        run: >
          sudo apt-get update && sudo apt-get install -y
          libegl1 libgl1 libfontconfig1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0
          libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0
          libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xkb1
      - name: Dépendances
        run: python -m pip install . pyinstaller pytest
      - name: Tests rapides
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -m "not corpus" tests/test_decoder.py tests/test_analysis.py tests/test_bf_filters.py tests/test_sliders.py
      - name: Exécutable
        # Les serveurs n'ont pas d'écran : si une bibliothèque crée une fenêtre pendant l'analyse, elle reste invisible.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m PyInstaller packaging/opentunebox.spec --noconfirm
      - name: Démarrage de l'exécutable (Linux)
        if: runner.os == 'Linux'
        # L'interface doit rester ouverte 20 s sans planter : « timeout » l'arrête alors avec le code 124.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          timeout 20 dist/OpenTuneBox/OpenTuneBox
          code=$?
          echo "code de sortie : $code"
          test $code -eq 124
      # Une seule archive par système, qui garde les droits d'exécution et les liens symboliques
      # (le zip automatique de GitHub les perd : programme Linux non exécutable, application Mac abîmée).
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist\OpenTuneBox -DestinationPath ${{ matrix.archive }}
      - name: Archive (macOS)
        if: runner.os == 'macOS'
        # Seulement OpenTuneBox.app : le dossier dist/OpenTuneBox en est une copie.
        run: ditto -c -k --sequesterRsrc --keepParent dist/OpenTuneBox.app ${{ matrix.archive }}
      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.archive }} -C dist OpenTuneBox
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.archive }}
          # Envoyée telle quelle, sans être zippée une seconde fois.
          archive: false
          if-no-files-found: error
