# Interface Rust (egui) pour Windows, à essayer à la main : compile `opentunebox-gui.exe` et l'envoie en artefact (1 jour).
# Se lance à la demande, et une fois sur toute demande de fusion qui modifie ce fichier.
name: Interface Windows
on:
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/gui-windows.yml"]

jobs:
  gui-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rust
        run: rustup toolchain install stable --profile minimal
      - name: Compilation
        working-directory: rust
        run: cargo build --release -p otb-gui
      - uses: actions/upload-artifact@v7
        with:
          path: rust/target/release/opentunebox-gui.exe
          archive: false
          if-no-files-found: error
          retention-days: 1
