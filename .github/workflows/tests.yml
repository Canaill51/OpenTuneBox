# Tests rapides (sans vrais logs) à chaque envoi et demande de fusion. Tout est en Rust depuis la phase 7-5 (D-035).
name: Tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bibliothèques système de l'interface
        # Gardées telles qu'avant la suppression du Python : leur utilité pour les tests d'otb-gui n'est pas vérifiée seule.
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1
      - name: Rust (compilateur, formatage, lint)
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: "Rust : formatage, lint et tests"
        working-directory: rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --no-fail-fast

  # Windows fait partie des livrables (D-031) : les mêmes tests y tournent à chaque envoi.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust
        run: rustup toolchain install stable --profile minimal
      - name: Tests Rust
        working-directory: rust
        run: cargo test --no-fail-fast
