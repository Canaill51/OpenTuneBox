# Tests rapides (sans vrais logs) à chaque envoi et demande de fusion. Tout est en Rust depuis la phase 7-5 (D-035).
name: Tests
on:
  push:
    branches: [main]
  pull_request:

# Lecture seule, écrit ici plutôt que laissé au réglage du dépôt (déjà « read ») : il le reste si ce réglage change un jour.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bibliothèques système de l'interface
        # Gardées telles qu'avant la suppression du Python : leur utilité pour les tests d'otb-gui n'est pas vérifiée seule.
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1
      - name: Rust
        # Version et composants : rust/rust-toolchain.toml (rustup la pose au premier appel à cargo).
        working-directory: rust
        run: rustup toolchain install
      - name: "Rust : formatage, lint et tests"
        working-directory: rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --no-fail-fast --locked
      - name: "Mentions de licences à jour (THIRD-PARTY-LICENSES.txt)"
        # Le fichier livré doit correspondre aux dépendances : sinon, relancer `cargo run -p otb-dev -- licenses`.
        working-directory: rust
        run: cargo run --locked -p otb-dev -- licenses --check

  # Windows fait partie des livrables (D-031) : les mêmes tests y tournent à chaque envoi.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust
        # La version et les composants viennent de rust/rust-toolchain.toml : rustup la pose au premier appel à cargo.
        working-directory: rust
        run: rustup toolchain install
      - name: "Lint du code propre à Windows"
        # fmt et clippy ne tournaient que sous Ubuntu : tout le code `cfg(windows)` échappait au lint.
        working-directory: rust
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests Rust
        working-directory: rust
        run: cargo test --no-fail-fast --locked
      - name: "Mentions de licences : même fichier que sous Linux ?"
        # Les mentions sont produites pour les deux cibles (D-042) depuis n'importe quel système : ce contrôle le prouve
        # sous Windows (lot 7a de docs/plan.md).
        working-directory: rust
        run: cargo run --locked -p otb-dev -- licenses --check

  # Relecture des workflows eux-mêmes (D-055) : syntaxe, expressions `${{ }}`, paramètres des actions, et scripts bash des étapes
  # `run:` passés à shellcheck (déjà présent sur les machines Ubuntu de GitHub). Rien à installer sur le poste de Cédric.
  # actionlint en version figée, vérifié par son empreinte SHA-256, relevée le 2026-11-11 dans actionlint_1.7.12_checksums.txt.
  # ⚠️ Dependabot ne voit pas cette version (ce n'est pas une action) : pour la monter, changer le numéro ET l'empreinte.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Relecture des workflows (actionlint)
        run: |
          v=1.7.12
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v$v/actionlint_${v}_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
