# Tests rapides (sans vrais logs) à chaque envoi et demande de fusion.
name: Tests
on:
  push:
    branches: [main, feat/rust-migration]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Bibliothèques système Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1
      - name: Rust (compilateur, formatage, lint)
        # L'extension opentunebox._native (D-031) se compile à l'installation : cargo est requis.
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Dépendances
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests scripts packaging/make_icons.py
      - name: "Rust : formatage, lint et tests"
        working-directory: rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test -p otb-decoder -p otb-dsp -p otb-format -p otb-log -p otb-analysis -p otb-advisor -p otb-cli -p otb-gui -p otb-parity -p otb-dev
      - name: Tests
        # --cov-report= : la couverture est seulement mesurée ici, le rapport est affiché plus bas
        run: python -m pytest -q --cov=opentunebox --cov-report=
      - name: Décodeur en Python pur (numba désactivé)
        # le code compilé par numba échappe aux mesures de couverture et masque des erreurs Python ;
        # --cov-append ajoute cette mesure à la précédente (L-025)
        run: OTB_BACKEND=python NUMBA_DISABLE_JIT=1 python -m pytest -q tests/test_decoder.py tests/test_flightlog.py tests/test_real_log.py --cov=opentunebox --cov-append --cov-report=
      - name: Couverture
        # Mesure seule, sans seuil (W-017) : la CI n'a pas les vrais logs du corpus. Rapport en bas de la page de l'exécution.
        run: |
          python -m coverage report
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  # Windows fait partie des livrables (D-031) : le décodeur Rust et ses tests de parité y tournent à chaque envoi.
  # Les autres tests de l'interface y seront ajoutés à mesure de la migration.
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Rust
        run: rustup toolchain install stable --profile minimal
      - name: Tests Rust
        working-directory: rust
        run: cargo test --no-fail-fast -p otb-decoder -p otb-dsp -p otb-format -p otb-log -p otb-analysis -p otb-advisor -p otb-cli -p otb-gui -p otb-parity -p otb-dev
      - name: Dépendances
        run: python -m pip install -e '.[dev]'
      - name: Tests du décodeur et des noyaux de calcul (numba et Rust)
        run: python -m pytest -q tests/test_native_decoder.py tests/test_decoder.py tests/test_bbl_decode.py tests/test_real_log.py tests/test_native_dsp.py tests/test_native_step.py tests/test_native_log.py tests/test_numeric.py tests/test_no_heavy_deps.py
