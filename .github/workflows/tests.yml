# Tests rapides (sans vrais logs) à chaque envoi et demande de fusion.
name: Tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Bibliothèques système Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1
      - name: Dépendances
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m pyflakes src tests scripts packaging/make_icons.py
      - name: Tests
        run: python -m pytest -q
      - name: Décodeur en Python pur (numba désactivé)
        # le code compilé par numba échappe aux mesures de couverture et masque des erreurs Python
        run: NUMBA_DISABLE_JIT=1 python -m pytest -q tests/test_decoder.py tests/test_flightlog.py tests/test_real_log.py
